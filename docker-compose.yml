services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-opencode_crm}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-32-characters}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      IMAGE_STORAGE_DIR: /app/storage/listing-images
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - crm_images:/app/storage/listing-images

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-opencode_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-opencode_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crm_postgres_data:
  crm_images:
